---
layout: default
---
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": {% if page.code_url %}"SoftwareSourceCode"{% else %}"CreativeWork"{% endif %},
  "name": {{ page.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  {% if page.code_url %}"codeRepository": {{ page.code_url | jsonify }},{% endif %}
  "author": { "@type": "Person", "@id": {{ "/#person" | absolute_url | jsonify }}, "name": "Malav Naik" }
}
</script>
<article>
  <p class="eyebrow"><a href="{{ '/work/' | relative_url }}">Work</a></p>
  <h1>{{ page.title }}</h1>
  <p class="lead">{{ page.summary | default: page.description }}</p>
  {% if page.tech %}<ul class="chips" aria-label="Tech used">{% for t in page.tech %}<li>{{ t }}</li>{% endfor %}</ul>{% endif %}
  <p class="actions">{% if page.demo_url %}<a class="btn btn-primary" href="{{ page.demo_url | relative_url }}">See it live</a>{% endif %}
     {% if page.code_url %}<a class="btn" href="{{ page.code_url }}">Code on GitHub</a>{% endif %}</p>
  {{ content }}
</article>
