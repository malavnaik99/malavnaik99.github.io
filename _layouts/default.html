<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>(function(d){var t;try{t=localStorage.getItem("theme")}catch(e){}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";d.dataset.theme=t;d.classList.add("js")})(document.documentElement)</script>
  {%- comment -%} jekyll-seo-tag's own JSON-LD is cut off here; _includes/schema.html writes the structured data instead. {%- endcomment -%}
  {% capture seo_tags %}{% seo %}{% endcapture %}{% assign seo_tags = seo_tags | split: '<script type="application/ld+json">' | first %}
  {%- comment -%} The plugin gives the home page a bare "Malav Naik" share title; use the full home title instead. {%- endcomment -%}
  {% if page.url == "/" %}{% assign full = site.title | append: " | " | append: site.tagline | escape %}{% assign seo_tags = seo_tags | replace: '<meta property="og:title" content="Malav Naik" />', '<meta property="og:title" content="FULL" />' | replace: '<meta property="twitter:title" content="Malav Naik" />', '<meta property="twitter:title" content="FULL" />' | replace: 'FULL', full %}{% endif %}{{ seo_tags }}
  <!-- Search Console code for the malavnaik.com property; the one in _config.yml is for the old github.io property. -->
  <meta name="google-site-verification" content="u0GXVjXGCfKV_599fhM71S3dI8h0X3AUgWg73udEDn0">
  {% if page.image_alt %}<meta property="og:image:alt" content="{{ page.image_alt | escape }}">{% endif %}
  {% if page.collection == "posts" %}<meta property="article:modified_time" content="{{ page.last_modified_at | default: page.date | date_to_xmlschema }}">{% endif %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  {% include schema.html %}
  <noscript><style>[role="tabpanel"][hidden]{display:block}</style></noscript>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="{{ '/' | relative_url }}">Malav Naik</a>
      <nav class="site-nav" id="site-nav" aria-label="Main">
        <ul>
        {% assign nav = "/work/|Work,/#toolkit|Toolkit,/#journey|Journey,/writing/|Writing" | split: "," %}
        {% for item in nav %}{% assign p = item | split: "|" %}
          <li><a href="{{ p[0] | relative_url }}"{% if page.url == p[0] %} aria-current="page"{% endif %}>{{ p[1] }}</a></li>
        {% endfor %}
          <li class="nav-resume"><a href="{{ '/resume/' | relative_url }}">Résumé</a></li>
        </ul>
      </nav>
      <button class="icon-btn theme-btn no-js-hide" type="button" aria-label="Switch between dark and light theme">
        <svg class="theme-dark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="theme-light-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a class="btn btn-accent header-resume" href="{{ '/resume/' | relative_url }}">Résumé</a>
      <button class="icon-btn menu-btn" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    </div>
  </header>
  <main id="main">
    {% if page.wide %}{{ content }}{% else %}<div class="container page"><div class="prose">{{ content }}</div></div>{% endif %}
  </main>
  <footer class="site-footer">
    <div class="container">
      <p class="label">Contact</p>
      <a class="email" href="mailto:malavnaikie@gmail.com">malavnaikie@gmail.com</a>
      <ul>{% for p in site.profiles %}<li><a href="{{ p.url }}" rel="me">{{ p.name }}</a></li>{% endfor %}</ul>
      <ul class="small"><li><a href="{{ '/about/' | relative_url }}">About</a></li><li><a href="{{ '/now/' | relative_url }}">Now</a></li><li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li><li>© {{ site.time | date: "%Y" }} Malav Naik</li></ul>
    </div>
  </footer>
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
  {% if site.goatcounter != "" %}<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>{% endif %}
</body>
</html>
