<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}document.documentElement.classList.add("js")</script>
  {%- comment -%} jekyll-seo-tag's own JSON-LD is cut off here; _includes/schema.html writes the structured data instead. {%- endcomment -%}
  {% capture seo_tags %}{% seo %}{% endcapture %}{{ seo_tags | split: '<script type="application/ld+json">' | first }}
  <!-- Search Console code for the malavnaik.com property; the one in _config.yml is for the old github.io property. -->
  <meta name="google-site-verification" content="u0GXVjXGCfKV_599fhM71S3dI8h0X3AUgWg73udEDn0">
  {% if page.image_alt %}<meta property="og:image:alt" content="{{ page.image_alt | escape }}">{% endif %}
  {% if page.collection == "posts" %}<meta property="article:modified_time" content="{{ page.last_modified_at | default: page.date | date_to_xmlschema }}">{% endif %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  {% assign fonts = "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" %}
  <link rel="preload" as="style" href="{{ fonts }}" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="{{ fonts }}"></noscript>
  {% include schema.html %}
  <style>
    :root { color-scheme: light; --bg: #fcfcfb; --surface: #f3f4f6; --text: #16181d; --muted: #525866; --line: #e3e5e9; --accent: #1d4ed8; --accent-soft: #e8eefc; --on-accent: #fff;
      --c-key: #8b2fb3; --c-str: #116329; --c-com: #6a6f78; --c-num: #9a4b00; --c-fn: #1d4ed8; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg: #0f1115; --surface: #181b21; --text: #e8eaed; --muted: #a5abb5; --line: #2a2e36; --accent: #8fb0ff; --accent-soft: #1a2440; --on-accent: #0f1115;
      --c-key: #d2a8ff; --c-str: #8fd19e; --c-com: #9198a1; --c-num: #ffb86b; --c-fn: #8fb0ff; } }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #0f1115; --surface: #181b21; --text: #e8eaed; --muted: #a5abb5; --line: #2a2e36; --accent: #8fb0ff; --accent-soft: #1a2440; --on-accent: #0f1115;
      --c-key: #d2a8ff; --c-str: #8fd19e; --c-com: #9198a1; --c-num: #ffb86b; --c-fn: #8fb0ff; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.7 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    h1, h2, h3 { font-family: "Source Serif 4", Georgia, serif; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; }
    h1 { font-size: clamp(2rem, 6vw, 2.75rem); margin: .2em 0 .4em; } h2 { font-size: 1.6rem; margin: 2.2rem 0 .6rem; } h3 { font-size: 1.25rem; font-weight: 600; margin: 1.6rem 0 .4rem; }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; } a:hover { text-decoration-thickness: 2px; }
    a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    img { max-width: 100%; height: auto; border-radius: 8px; }
    .skip { position: absolute; left: -999px; } .skip:focus { left: 1rem; top: 1rem; z-index: 20; background: var(--bg); padding: .5rem; }
    .container { max-width: 1080px; margin: 0 auto; padding: 0 1.25rem; }
    .prose { max-width: 680px; margin: 0 auto; }
    main { padding: 2.5rem 0 4rem; }
    .muted { color: var(--muted); } .small { font-size: .875rem; }
    .eyebrow { font: 600 .8rem/1.4 Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0; }
    /* header */
    .site-header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
    .site-header .container { display: flex; align-items: center; gap: 1rem; min-height: 3.75rem; flex-wrap: wrap; }
    .brand { font: 700 1.1rem/1 "Source Serif 4", Georgia, serif; color: var(--text); text-decoration: none; margin-right: auto; }
    .site-nav ul { display: flex; gap: .25rem 1.25rem; list-style: none; margin: 0; padding: 0; font-size: .95rem; }
    .site-nav a { color: var(--muted); text-decoration: none; } .site-nav a:hover, .site-nav a[aria-current] { color: var(--text); }
    .site-nav a[aria-current] { font-weight: 600; }
    .icon-btn { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px; height: 2.25rem; min-width: 2.25rem; display: inline-flex; align-items: center; justify-content: center; gap: .4rem; cursor: pointer; font: 500 .9rem Inter, sans-serif; padding: 0 .5rem; }
    .icon-btn svg { width: 1.1rem; height: 1.1rem; }
    .menu-btn { display: none; }
    @media (max-width: 760px) {
      .js .menu-btn { display: inline-flex; }
      .js .site-nav { order: 3; flex-basis: 100%; display: none; } .js .site-nav.open { display: block; }
      .site-nav ul { flex-wrap: wrap; padding: .25rem 0 .75rem; } .js .site-nav ul { flex-direction: column; gap: 0; }
      .js .site-nav a { display: block; padding: .6rem 0; border-top: 1px solid var(--line); }
    }
    .theme-dark-icon { display: none; }
    :root[data-theme="dark"] .theme-dark-icon { display: block; } :root[data-theme="dark"] .theme-light-icon { display: none; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .theme-dark-icon { display: block; } :root:not([data-theme="light"]) .theme-light-icon { display: none; } }
    .no-js-hide { display: none; } .js .no-js-hide { display: inline-flex; }
    /* buttons, cards, chips */
    .btn { display: inline-block; padding: .65rem 1.1rem; border-radius: 8px; border: 1px solid var(--line); color: var(--text); text-decoration: none; font-weight: 600; font-size: .95rem; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .btn:hover { text-decoration: none; filter: brightness(1.05); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); gap: 1.25rem; list-style: none; padding: 0; margin: 1rem 0; }
    .card { border: 1px solid var(--line); border-radius: 12px; padding: 1.25rem 1.35rem; background: var(--bg); }
    .card h3 { margin: .2rem 0 .5rem; font-size: 1.2rem; } .card h3 a { color: var(--text); text-decoration: none; } .card h3 a:hover { color: var(--accent); }
    .card p { margin: 0 0 .6rem; font-size: .95rem; line-height: 1.6; }
    .meta { font-size: .85rem; color: var(--muted); margin: 0; }
    .tag { display: inline-block; font-size: .78rem; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: .05rem .6rem; text-decoration: none; }
    .chips { display: flex; flex-wrap: wrap; gap: .4rem; padding: 0; margin: .6rem 0; list-style: none; }
    .chips li { border: 1px solid var(--line); border-radius: 99px; padding: .05rem .65rem; font-size: .8rem; color: var(--muted); }
    .chips a { color: inherit; text-decoration: none; }
    .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-top: 3rem; }
    .section-head h2 { margin: 0; } .section-head a { font-size: .95rem; }
    /* prose */
    .prose p, .prose li { overflow-wrap: break-word; }
    pre { position: relative; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); padding: 1rem; border-radius: 8px; font-size: .85rem; line-height: 1.55; }
    code { font: .88em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; } :not(pre) > code { background: var(--surface); padding: .1em .35em; border-radius: 4px; }
    .highlight .k, .highlight .kd, .highlight .kn, .highlight .kr, .highlight .kc, .highlight .ow, .highlight .nt { color: var(--c-key); }
    .highlight .s, .highlight .s1, .highlight .s2, .highlight .sd, .highlight .sb { color: var(--c-str); }
    .highlight .c, .highlight .c1, .highlight .cm, .highlight .ch, .highlight .cs { color: var(--c-com); font-style: italic; }
    .highlight .m, .highlight .mi, .highlight .mf, .highlight .kt { color: var(--c-num); } .highlight .nf, .highlight .nb, .highlight .na { color: var(--c-fn); }
    .copy-btn { position: absolute; top: .4rem; right: .4rem; font: 500 .75rem Inter, sans-serif; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: .2rem .5rem; cursor: pointer; }
    table { border-collapse: collapse; display: block; overflow-x: auto; font-size: .92rem; margin: 1rem 0; }
    td, th { border-bottom: 1px solid var(--line); padding: .45rem .7rem; text-align: left; vertical-align: top; } th { font-weight: 600; }
    blockquote { margin: 1.25rem 0; padding: .1rem 1.1rem; border-left: 3px solid var(--accent); color: var(--muted); }
    hr { border: 0; border-top: 1px solid var(--line); margin: 2.5rem 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    /* home */
    .hero { display: grid; grid-template-columns: 220px 1fr; gap: 2.5rem; align-items: center; }
    .hero img { width: 220px; height: 220px; object-fit: cover; border-radius: 50%; }
    .hero h1 { margin: .1em 0 .1em; } .hero .lead { font-size: 1.3rem; color: var(--text); font-weight: 500; }
    .proof { list-style: none; padding: 0; margin: 1.2rem 0; display: grid; gap: .5rem; font-size: .98rem; }
    .proof li { padding-left: 1.1rem; position: relative; } .proof li::before { content: ""; position: absolute; left: 0; top: .7em; width: .45rem; height: .45rem; border-radius: 2px; background: var(--accent); }
    .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1.2rem 0 0; }
    @media (max-width: 760px) { .hero { grid-template-columns: 1fr; gap: 1.25rem; } .hero img { width: 128px; height: 128px; } }
    .lab { margin-top: 3rem; } .lab h2 { margin-top: 0; font-size: 1.3rem; }
    .filters { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1.5rem 0 .5rem; }
    .filters .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .case dl { margin: .4rem 0 .6rem; font-size: .92rem; line-height: 1.55; } .case dt { font-weight: 600; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: .6rem; } .case dd { margin: .1rem 0 0; }
    /* posts */
    .lead { font-size: 1.15rem; color: var(--muted); margin: 0 0 .8rem; }
    .tldr { background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: .8rem 1.1rem; margin: 1.5rem 0; }
    .tldr p:last-child { margin-bottom: 0; }
    .toc { border: 1px solid var(--line); border-radius: 8px; padding: .8rem 1.1rem; margin: 1.5rem 0; font-size: .95rem; } .toc ol { margin: .3rem 0 0; padding-left: 1.2rem; }
    .share { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin: 2rem 0; } .btn.small { padding: .35rem .75rem; font-size: .85rem; cursor: pointer; background: var(--bg); }
    .author { display: flex; gap: 1rem; align-items: flex-start; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 1.25rem 0; margin: 2rem 0; }
    .author img { width: 72px; height: 72px; object-fit: cover; border-radius: 50%; flex: none; } .author p { margin: 0 0 .3rem; font-size: .95rem; line-height: 1.6; }
    ul.plain { list-style: none; padding: 0; } ul.plain li { margin: 0 0 1rem; }
    /* footer */
    .site-footer { border-top: 1px solid var(--line); padding: 2rem 0 3rem; font-size: .9rem; color: var(--muted); }
    .site-footer ul { display: flex; flex-wrap: wrap; gap: .3rem 1.1rem; padding: 0; margin: .4rem 0 1rem; list-style: none; }
    .site-footer a { color: var(--muted); } .site-footer a:hover { color: var(--text); }
    @page { margin: 12mm 14mm; }
    @media print { .site-header, .site-footer, .noprint { display: none; } body { font-size: 10pt; line-height: 1.45; } main { padding: 0; } h1 { font-size: 18pt; margin: 0 0 .3rem; } h2 { font-size: 12.5pt; margin: .9rem 0 .3rem; } p, ul, dl { margin: .3rem 0; } a { color: inherit; } }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="{{ '/' | relative_url }}">Malav Naik</a>
      <button class="icon-btn theme-btn no-js-hide" type="button" aria-label="Switch between light and dark theme">
        <svg class="theme-light-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="theme-dark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn menu-btn" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav class="site-nav" id="site-nav" aria-label="Main">
        <ul>
        {% assign nav = "/|Home,/blog/|Blog,/projects/|Projects,/about/|About,/resume/|Résumé,/contact/|Contact" | split: "," %}
        {% for item in nav %}{% assign p = item | split: "|" %}{% assign cur = false %}{% if page.url == p[0] %}{% assign cur = true %}{% elsif p[0] != "/" and page.url contains p[0] %}{% assign cur = true %}{% endif %}
          <li><a href="{{ p[0] | relative_url }}"{% if cur %} aria-current="page"{% endif %}>{{ p[1] }}</a></li>
        {% endfor %}
        </ul>
      </nav>
    </div>
  </header>
  <main id="main">
    <div class="container">
      {% if page.wide %}{{ content }}{% else %}<div class="prose">{{ content }}</div>{% endif %}
    </div>
  </main>
  <footer class="site-footer">
    <div class="container">
      Find me online:
      <ul>{% for p in site.profiles %}<li><a href="{{ p.url }}" rel="me">{{ p.name }}</a></li>{% endfor %}</ul>
      <ul><li><a href="{{ '/now/' | relative_url }}">Now</a></li><li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li><li><a href="{{ '/llms.txt' | relative_url }}">llms.txt</a></li><li>© {{ site.time | date: "%Y" }} Malav Naik</li></ul>
    </div>
  </footer>
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
  {% if site.goatcounter != "" %}<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>{% endif %}
</body>
</html>
