<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <style>
    :root { --text: #1f2328; --muted: #59636e; --bg: #fff; --link: #0b57d0; --line: #e5e7eb; }
    @media (prefers-color-scheme: dark) { :root { --text: #e6e6e6; --muted: #a0a7b0; --bg: #111418; --link: #8ab4f8; --line: #2a2f36; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 42rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
    nav { display: flex; gap: 1.25rem; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: .75rem; margin-bottom: 2rem; }
    nav a:first-child { font-weight: 700; margin-right: auto; color: var(--text); }
    a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
    img { max-width: 100%; height: auto; border-radius: 8px; }
    h1 { line-height: 1.25; } .muted { color: var(--muted); font-size: .9rem; }
    pre { overflow-x: auto; background: rgba(127,127,127,.12); padding: .75rem; border-radius: 6px; font-size: .85rem; }
    code { font-size: .9em; } table { border-collapse: collapse; display: block; overflow-x: auto; }
    td, th { border: 1px solid var(--line); padding: .3rem .6rem; }
    ul.posts { list-style: none; padding: 0; } ul.posts li { margin: 0 0 1.1rem; }
    footer { margin-top: 3rem; border-top: 1px solid var(--line); padding-top: 1rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a href="/">Malav Naik</a>
      <a href="/">Blog</a>
      <a href="/about/">About</a>
      <a href="/permits-2025/">Projects</a>
    </nav>
    <main>{{ content }}</main>
    <footer class="muted">
      <a href="https://www.linkedin.com/in/malav-naik">LinkedIn</a> ·
      <a href="https://github.com/malavnaik99">GitHub</a>
    </footer>
  </div>
</body>
</html>
