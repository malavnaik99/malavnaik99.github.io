  # ---------------- Stamp 1 ----------------
  - stamp: "1"
    topic: allows
    summary: "Permission to work or run a business in Ireland, subject to conditions. To get it you need a valid employment permit, or a letter from ISD saying you can work without one."
    quote:
      - "Stamp 1 indicates permission to work or operate a business in Ireland, subject to conditions."
      - "In order to obtain a stamp 1 permission, you must hold a valid employment permit, or a letter from ISD stating that you can work without an employment permit."
    official_url: "https://www.irishimmigration.ie/registering-your-immigration-permission/information-on-registering/immigration-permission-stamps/"
    source_name: "Immigration Service Delivery"
    last_verified: "2026-11-24"
    reviewed: false
    notes: ""
  - stamp: "1"
    topic: work
    summary: "You need an employment permit before you start a job, unless your letter of permission says you don't need one."
    quote:
      - "You must not start a job or enter employment unless you or your employer has obtained an employment permit for you, or if your letter of permission clearly states you do not require an employment permit."
    official_url: "https://www.irishimmigration.ie/registering-your-immigration-permission/information-on-registering/immigration-permission-stamps/"
    source_name: "Immigration Service Delivery"
    last_verified: "2026-11-24"
    reviewed: false
    notes: ""
  - stamp: "1"
    topic: register
    summary: "Register your permission within 90 days (first registrations are at Burgh Quay, Dublin; renewals are online), and renew before your permission and registration expire."
    quote:
      - "Once you have a permission to stay in Ireland you must register it with the Irish immigration authorities, known as Immigration Service Delivery (ISD) within 90 days."
      - "ISD registers first time permissions at Burgh Quay in Dublin. All subsequent permission renewals within the Republic of Ireland are to be applied for online."
      - "If you wish to stay in Ireland past the expiry date of your immigration permission, you must apply to renew your permission and registration before they expire."
    official_url: "https://www.irishimmigration.ie/registering-your-immigration-permission/information-on-registering/immigration-permission-stamps/"
    source_name: "Immigration Service Delivery"
    last_verified: "2026-11-24"
    reviewed: false
    notes: ""
  - stamp: "1"
    topic: citizenship
    summary: "Yes, time on Stamp 1 is reckonable residence for citizenship by naturalisation, subject to the other conditions."
    quote:
      - "Stamp 1 is reckonable as residence when applying for citizenship by naturalisation."
      - "The time you accumulate on certain stamps may be used to calculate your reckonable residence (subject to conditions) if you apply for citizenship by naturalisation."
    official_url: "https://www.irishimmigration.ie/registering-your-immigration-permission/information-on-registering/immigration-permission-stamps/"
    source_name: "Immigration Service Delivery"
    last_verified: "2026-11-24"
    reviewed: false
    notes: ""

  # ---------------- Stamp 1G ----------------
  - stamp: "1g"
    topic: allows
    summary: "Either you've finished your studies here and can look for work under the Third Level Graduate Programme, or you're the spouse or de facto partner of a Critical Skills Employment Permit holder or of a researcher on a Hosting Agreement."
    quote:
      - "Stamp 1G indicates you have finished your studies in Ireland and have permission to look for employment here under the Third Level Graduate Programme, subject to conditions."
      - "Stamp 1G may also be given to spouses or de facto partners of a CSEP holder or of researchers in the State on a Hosting Agreement."
    official_url: "https://www.irishimmigration.ie/registering-your-immigration-permission/information-on-registering/immigration-permission-stamps/"
    source_name: "Immigration Service Delivery"
    last_verified: "2026-11-25"
    reviewed: true
    notes: ""
  - stamp: "1g"
    topic: work
    summary: "Graduates can work full time but can't run a business or be self-employed. Spouses and partners can work without an employment permit, but also can't run a business or be self-employed."
    quote:
      - "You can work full time in accordance with employment law requirements, but you are not permitted to operate a business or be self-employed."
      - "Stamp 1G allows the holder to take up employment without the need to obtain an employment permit."
      - "Not permitted to establish or operate a business"
      - "Not permitted to be self-employed"
    official_url: "https://www.irishimmigration.ie/registering-your-immigration-permission/information-on-registering/immigration-permission-stamps/"
    source_name: "Immigration Service Delivery"
    last_verified: "2026-11-25"
    reviewed: true
    notes: ""
  - stamp: "1g"
    topic: register
    summary: "Graduates: granted for 12 months, with a possible further 12 months after a master's degree. Spouses and partners: renew every year, and after 5 years you may apply for Stamp 4."
    quote:
      - "Stamp 1G is granted for 12 months only, except for those who have completed a master’s degree programme, when a further 12 months can be provided subject to conditions."
      - "Renewal of the Stamp 1G registration should be applied for annually, and after 5 years on a Stamp 1G, you may apply for a Stamp 4."
    official_url: "https://www.irishimmigration.ie/registering-your-immigration-permission/information-on-registering/immigration-permission-stamps/"
    source_name: "Immigration Service Delivery"
    last_verified: "2026-11-25"
    reviewed: true
    notes: ""
  - stamp: "1g"
    topic: health
    summary: "For graduates, ISD says your other conditions stay the same as Stamp 2, which rules out publicly funded services such as public hospitals unless you have an entitlement via other means."
    quote:
      - "While on a Stamp 1G, your other permissions and conditions remain the same as for Stamp 2"
      - "You cannot receive any benefits or use publicly funded services (for example, public hospitals) unless you have an entitlement via other means."
    official_url: "https://www.irishimmigration.ie/registering-your-immigration-permission/information-on-registering/immigration-permission-stamps/"
    source_name: "Immigration Service Delivery"
    last_verified: "2026-11-25"
    reviewed: true
    notes: "Applies to Stamp 1G graduates; the page doesn't say the same for spouses and partners."
  - stamp: "1g"
    topic: citizenship
    summary: "Yes, time on Stamp 1G, as a graduate or as a spouse or partner, counts as reckonable residence for citizenship, subject to the other conditions."
    quote:
      - "Note: Periods spent on Stamp 1G either as a Graduate Student or a Spouse/de facto partner of a Critical Skills Employment Permit holder or a Spouse/de facto partner of Researchers in the State on Hosting Agreements are considered as reckonable residence for the purpose of making an application for Citizenship/Naturalisation."
    official_url: "https://www.irishimmigration.ie/registering-your-immigration-permission/information-on-registering/immigration-permission-stamps/"
    source_name: "Immigration Service Delivery"
    last_verified: "2026-11-25"
    reviewed: true
    notes: ""

