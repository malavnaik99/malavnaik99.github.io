# Living in Ireland: the single source of truth for /living-in-ireland/ and every /living-in-ireland/stamp-<x>/ page.
#
# One row per stamp × topic. A row's summary appears on the site ONLY when `reviewed: true` (Malav has checked it
# against the official page). Unreviewed rows show just the official link, or "official source being added".
# Every quote must appear word for word on the official page: scripts/stamps_check.py --self-test checks this
# against the saved copy in data/stamps/snapshots/ and the deploy stops if one doesn't.
#
# To mark a row checked:   python3 scripts/stamps_check.py --verify 4/work      (sets reviewed: true and today's date)
# To refresh the review list for Malav:   python3 scripts/stamps_check.py --review
#
# Wording rule: "you may be eligible if… check here", never "you are entitled to" (the self-test enforces it).

stamps:
  - { id: "0", name: "Stamp 0" }
  - { id: "1", name: "Stamp 1" }
  - { id: "1g", name: "Stamp 1G" }
  - { id: "2", name: "Stamp 2" }
  - { id: "2a", name: "Stamp 2A" }
  - { id: "3", name: "Stamp 3" }
  - { id: "4", name: "Stamp 4" }
  - { id: "5", name: "Stamp 5" }
  - { id: "6", name: "Stamp 6" }

# `short` is the table column heading; `q` is the FAQ question (STAMP is replaced by e.g. "Stamp 4"; topics without
# a `q` get no FAQ entry); `depends` is what the answer depends on, shown when the row isn't reviewed yet (taken from
# the brief: eligibility usually depends on more than the stamp).
topics:
  - id: allows
    title: "What this stamp allows"
    short: "Allows"
  - id: work
    title: "Working rights"
    short: "Work"
    q: "Can I work on STAMP in Ireland?"
    depends: "It depends on the conditions of your permission and any letter of permission from Immigration Service Delivery."
  - id: register
    title: "Registering and renewing (IRP)"
    short: "Register / renew"
    q: "How do I register or renew STAMP?"
    depends: "It depends on your permission. Immigration Service Delivery handles registration and renewals."
  - id: health
    title: "Healthcare"
    short: "Healthcare"
    q: "Can I use public healthcare on STAMP?"
    depends: "It depends on more than your stamp, including the conditions of your permission and whether you live here."
  - id: tax
    title: "Tax and Revenue (tax credits, emergency tax)"
    short: "Tax"
  - id: prsi
    title: "PRSI-based payments"
    short: "PRSI payments"
    q: "Can I get PRSI-based social welfare payments on STAMP?"
    depends: "It depends on more than your stamp, including your PRSI contributions and the conditions of your permission."
  - id: means
    title: "Means-tested payments (Habitual Residence Condition)"
    short: "Means-tested"
    q: "Can I get means-tested payments on STAMP?"
    depends: "It depends on more than your stamp, including the Habitual Residence Condition, a means test and the conditions of your permission."
  - id: housing
    title: "Housing"
    short: "Housing"
  - id: family
    title: "Family and dependants"
    short: "Family"
  - id: citizenship
    title: "Does this time count towards citizenship?"
    short: "Citizenship"
    q: "Does time on STAMP count towards Irish citizenship?"
    depends: "It depends on whether your stamp counts as reckonable residence and on the other naturalisation conditions."

# Free personal help. `checked: true` means the address was confirmed to load; others show without a link until then.
help:
  - { name: "Citizens Information", url: "https://www.citizensinformation.ie/en/", checked: true }
  - { name: "Crosscare Migrant Project", url: "https://www.crosscare.ie/", checked: false }
  - { name: "Migrant Rights Centre Ireland", url: "https://www.mrci.ie/", checked: false }

