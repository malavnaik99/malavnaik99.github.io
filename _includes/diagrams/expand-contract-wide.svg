<svg class="dg dg-wide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="expand-contract-w-t expand-contract-w-d">
<title id="expand-contract-w-t">Expand and contract: one risky change split into three safe releases</title>
<desc id="expand-contract-w-d">Release 1, expand: add the new mobile_e164 column as nullable, write both columns, backfill in batches; rollback is a code rollback. Release 2, migrate: read mobile_e164, still write both, check there are zero mismatches; rollback is still a code rollback. Release 3, contract: take a fresh, tested backup, stop writing phone, then drop it; this is the only point of no return.</desc>
<defs><marker id="expand-contract-w-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 10 5 0 10z"/></marker></defs>
<rect class="k-n" x="16" y="12" width="282" height="236" rx="14"/>
<text x="157" y="44" class="hd" text-anchor="middle">Release 1 · Expand</text>
<text x="36" y="78">• Add mobile_e164 (nullable)</text>
<text x="36" y="104">• Write both columns</text>
<text x="36" y="130">• Backfill in batches</text>
<rect class="k-n" x="36" y="152" width="80" height="30" rx="8"/>
<text x="76" y="172" class="sm" text-anchor="middle">phone</text>
<rect class="k-ok" x="124" y="152" width="154" height="30" rx="8"/>
<text x="201" y="172" class="sm" text-anchor="middle">mobile_e164 (new)</text>
<rect class="k-ok" x="36" y="198" width="242" height="34" rx="10"/>
<g class="ic ic-ok" transform="translate(56 215)"><circle r="10"/><path class="gl" d="M-4.5 .5 -1.5 3.5 4.5-3"/></g>
<text x="76" y="220" class="b">Rollback: code only</text>
<rect class="k-n" x="339" y="12" width="282" height="236" rx="14"/>
<text x="480" y="44" class="hd" text-anchor="middle">Release 2 · Migrate</text>
<text x="359" y="78">• Read mobile_e164</text>
<text x="359" y="104">• Still write both</text>
<text x="359" y="130">• Check: 0 mismatches</text>
<rect class="k-n" x="359" y="152" width="80" height="30" rx="8"/>
<text x="399" y="172" class="sm" text-anchor="middle">phone</text>
<rect class="k-ok" x="447" y="152" width="154" height="30" rx="8"/>
<text x="524" y="172" class="sm" text-anchor="middle">mobile_e164</text>
<rect class="k-ok" x="359" y="198" width="242" height="34" rx="10"/>
<g class="ic ic-ok" transform="translate(379 215)"><circle r="10"/><path class="gl" d="M-4.5 .5 -1.5 3.5 4.5-3"/></g>
<text x="399" y="220" class="b">Rollback: code only</text>
<line class="ln" x1="299" y1="130" x2="337" y2="130" marker-end="url(#expand-contract-w-ah)"/>
<rect class="k-n" x="662" y="12" width="282" height="236" rx="14"/>
<text x="803" y="44" class="hd" text-anchor="middle">Release 3 · Contract</text>
<text x="682" y="78">• Fresh, tested backup</text>
<text x="682" y="104">• Stop writing phone</text>
<text x="682" y="130">• Drop phone</text>
<rect class="k-lost" x="682" y="152" width="80" height="30" rx="8"/>
<text x="722" y="172" class="sm" text-anchor="middle">phone</text>
<rect class="k-ok" x="770" y="152" width="154" height="30" rx="8"/>
<text x="847" y="172" class="sm" text-anchor="middle">mobile_e164</text>
<rect class="k-warn" x="682" y="198" width="242" height="34" rx="10"/>
<g class="ic ic-warn" transform="translate(702 215)"><circle r="10"/><path class="gl" d="M0-5V1"/><circle class="gd" cx="0" cy="4.6" r="1.4"/></g>
<text x="722" y="220" class="b">Point of no return</text>
<line class="ln" x1="622" y1="130" x2="660" y2="130" marker-end="url(#expand-contract-w-ah)"/>
</svg>
