<svg class="dg dg-wide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="where-it-breaks-w-t where-it-breaks-w-d">
<title id="where-it-breaks-w-t">Where a maintenance window breaks</title>
<desc id="where-it-breaks-w-d">The same eight-step timeline with six failure points pinned to the steps they hit. Deploy: config drift, such as an expired certificate or secret (warning). Migrations: a migration that is far slower at production scale (warning) and discovered data corruption (failure). Smoke tests: MFA codes don&#x27;t arrive (failure) and a broken payment or SMS integration (failure). Reopen: a security finding that must be fixed first (failure), so reopening is blocked. Every fix also needs a change approval, a vendor ticket and a sign-off.</desc>
<defs><marker id="where-it-breaks-w-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 10 5 0 10z"/></marker></defs>
<rect class="k-user" x="16" y="44" width="104" height="74" rx="12"/>
<text x="68" y="86" class="b" text-anchor="middle">Announce</text>
<text x="68" y="30" class="sm" text-anchor="middle">1</text>
<rect class="k-n" x="134" y="44" width="104" height="74" rx="12"/>
<text x="186" y="76.5" class="b" text-anchor="middle">Freeze</text>
<text x="186" y="95.5" class="b" text-anchor="middle">changes</text>
<text x="186" y="30" class="sm" text-anchor="middle">2</text>
<line class="ln" x1="121" y1="81" x2="133" y2="81" marker-end="url(#where-it-breaks-w-ah)"/>
<rect class="k-user" x="252" y="44" width="104" height="74" rx="12"/>
<text x="304" y="76.5" class="b" text-anchor="middle">Holding</text>
<text x="304" y="95.5" class="b" text-anchor="middle">page on</text>
<text x="304" y="30" class="sm" text-anchor="middle">3</text>
<line class="ln" x1="239" y1="81" x2="251" y2="81" marker-end="url(#where-it-breaks-w-ah)"/>
<rect class="k-n" x="370" y="44" width="104" height="74" rx="12"/>
<text x="422" y="76.5" class="b" text-anchor="middle">Backup &amp;</text>
<text x="422" y="95.5" class="b" text-anchor="middle">snapshot</text>
<text x="422" y="30" class="sm" text-anchor="middle">4</text>
<line class="ln" x1="357" y1="81" x2="369" y2="81" marker-end="url(#where-it-breaks-w-ah)"/>
<rect class="k-n" x="488" y="44" width="104" height="74" rx="12"/>
<text x="540" y="76.5" class="b" text-anchor="middle">Deploy new</text>
<text x="540" y="95.5" class="b" text-anchor="middle">version</text>
<text x="540" y="30" class="sm" text-anchor="middle">5</text>
<line class="ln" x1="475" y1="81" x2="487" y2="81" marker-end="url(#where-it-breaks-w-ah)"/>
<rect class="k-n" x="606" y="44" width="104" height="74" rx="12"/>
<text x="658" y="76.5" class="b" text-anchor="middle">Run</text>
<text x="658" y="95.5" class="b" text-anchor="middle">migrations</text>
<text x="658" y="30" class="sm" text-anchor="middle">6</text>
<line class="ln" x1="593" y1="81" x2="605" y2="81" marker-end="url(#where-it-breaks-w-ah)"/>
<rect class="k-n" x="724" y="44" width="104" height="74" rx="12"/>
<text x="776" y="76.5" class="b" text-anchor="middle">Smoke</text>
<text x="776" y="95.5" class="b" text-anchor="middle">tests</text>
<text x="776" y="30" class="sm" text-anchor="middle">7</text>
<line class="ln" x1="711" y1="81" x2="723" y2="81" marker-end="url(#where-it-breaks-w-ah)"/>
<rect class="k-bad" x="842" y="44" width="104" height="74" rx="12"/>
<text x="894" y="76.5" class="b" text-anchor="middle">Reopen</text>
<text x="894" y="95.5" class="sm" text-anchor="middle">blocked</text>
<g class="ic ic-bad" transform="translate(942 48)"><circle r="10"/><path class="gl" d="M-3.5-3.5 3.5 3.5M3.5-3.5-3.5 3.5"/></g>
<text x="894" y="30" class="sm" text-anchor="middle">8</text>
<line class="ln" x1="829" y1="81" x2="841" y2="81" marker-end="url(#where-it-breaks-w-ah)"/>
<circle class="k-warn num pin" cx="540" cy="118" r="13"/>
<text x="540" y="123" class="sm" text-anchor="middle">1</text>
<circle class="k-warn num pin" cx="643" cy="118" r="13"/>
<text x="643" y="123" class="sm" text-anchor="middle">2</text>
