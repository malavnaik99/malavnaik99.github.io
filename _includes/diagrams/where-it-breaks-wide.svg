<text x="761" y="123" class="sm" text-anchor="middle">4</text>
<circle class="k-bad num pin" cx="791" cy="118" r="13"/>
<text x="791" y="123" class="sm" text-anchor="middle">5</text>
<circle class="k-bad num pin" cx="894" cy="118" r="13"/>
<text x="894" y="123" class="sm" text-anchor="middle">6</text>
<rect class="k-warn" x="16" y="158" width="298" height="62" rx="12"/>
<circle class="k-warn num" cx="40" cy="189" r="13"/>
<text x="40" y="194" class="sm" text-anchor="middle">1</text>
<g class="ic ic-warn" transform="translate(292 189)"><circle r="10"/><path class="gl" d="M0-5V1"/><circle class="gd" cx="0" cy="4.6" r="1.4"/></g>
<text x="64" y="184" class="b">Config drift</text>
<text x="64" y="205" class="sm">Expired certificate or secret</text>
<rect class="k-warn" x="330" y="158" width="298" height="62" rx="12"/>
<circle class="k-warn num" cx="354" cy="189" r="13"/>
<text x="354" y="194" class="sm" text-anchor="middle">2</text>
<g class="ic ic-warn" transform="translate(606 189)"><circle r="10"/><path class="gl" d="M0-5V1"/><circle class="gd" cx="0" cy="4.6" r="1.4"/></g>
<text x="378" y="184" class="b">Slow migration</text>
<text x="378" y="205" class="sm">Hours, not minutes, at scale</text>
<rect class="k-bad" x="644" y="158" width="298" height="62" rx="12"/>
<circle class="k-bad num" cx="668" cy="189" r="13"/>
<text x="668" y="194" class="sm" text-anchor="middle">3</text>
<g class="ic ic-bad" transform="translate(920 189)"><circle r="10"/><path class="gl" d="M-3.5-3.5 3.5 3.5M3.5-3.5-3.5 3.5"/></g>
<text x="692" y="184" class="b">Data corruption</text>
<text x="692" y="205" class="sm">Bad rows stop the migration</text>
<rect class="k-bad" x="16" y="234" width="298" height="62" rx="12"/>
<circle class="k-bad num" cx="40" cy="265" r="13"/>
<text x="40" y="270" class="sm" text-anchor="middle">4</text>
<g class="ic ic-bad" transform="translate(292 265)"><circle r="10"/><path class="gl" d="M-3.5-3.5 3.5 3.5M3.5-3.5-3.5 3.5"/></g>
<text x="64" y="260" class="b">Failed smoke test</text>
<text x="64" y="281" class="sm">MFA codes don&#x27;t arrive</text>
<rect class="k-bad" x="330" y="234" width="298" height="62" rx="12"/>
<circle class="k-bad num" cx="354" cy="265" r="13"/>
<text x="354" y="270" class="sm" text-anchor="middle">5</text>
<g class="ic ic-bad" transform="translate(606 265)"><circle r="10"/><path class="gl" d="M-3.5-3.5 3.5 3.5M3.5-3.5-3.5 3.5"/></g>
<text x="378" y="260" class="b">Broken integration</text>
<text x="378" y="281" class="sm">Payment or SMS calls fail</text>
<rect class="k-bad" x="644" y="234" width="298" height="62" rx="12"/>
<circle class="k-bad num" cx="668" cy="265" r="13"/>
<text x="668" y="270" class="sm" text-anchor="middle">6</text>
<g class="ic ic-bad" transform="translate(920 265)"><circle r="10"/><path class="gl" d="M-3.5-3.5 3.5 3.5M3.5-3.5-3.5 3.5"/></g>
<text x="692" y="260" class="b">Security finding</text>
<text x="692" y="281" class="sm">Must be fixed before reopen</text>
<rect class="k-warn" x="16" y="318" width="928" height="62" rx="12"/>
<g class="ic ic-warn" transform="translate(46 349)"><circle r="10"/><path class="gl" d="M0-5V1"/><circle class="gd" cx="0" cy="4.6" r="1.4"/></g>
<text x="72" y="345" class="b">Each fix also waits for: change approval  →  vendor ticket  →  sign-off</text>
<text x="72" y="366" class="sm">Organisational overhead turns a 20-minute fix into half a day.</text>
</svg>
