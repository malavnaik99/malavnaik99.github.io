<g class="ic ic-ok" transform="translate(126 215)"><circle r="10"/><path class="gl" d="M-4.5 .5 -1.5 3.5 4.5-3"/></g>
<text x="142" y="220" class="sm">Deploy finishes</text>
<rect class="k-bad" x="110" y="236" width="234" height="30" rx="10"/>
<g class="ic ic-bad" transform="translate(126 251)"><circle r="10"/><path class="gl" d="M-3.5-3.5 3.5 3.5M3.5-3.5-3.5 3.5"/></g>
<text x="142" y="256" class="sm">MFA smoke test fails</text>
