<svg class="dg dg-narrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 914" role="img" aria-labelledby="three-day-outage-n-t three-day-outage-n-d">
<title id="three-day-outage-n-t">A hypothetical three-day outage (illustrative, not based on any real organisation)</title>
<desc id="three-day-outage-n-d">An illustrative timeline only, not the real events at any organisation. Four swimlanes over three days. Day 1: the deploy finishes but the MFA smoke test fails; the migration runs four times longer than planned; an emergency change is raised; users see the holding page all evening. Day 2: engineering waits on the SMS vendor; data checks find bad rows and the team must choose restore or fix forward; each fix needs approval; users wait for updates. Day 3: a fix-forward is deployed, bad rows are reconciled, security signs off, and the site reopens in phases. The planned window was 3 hours; the actual outage was about 3 days.</desc>
<defs><marker id="three-day-outage-n-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 10 5 0 10z"/></marker></defs>
<rect class="k-warn" x="16" y="8" width="328" height="58" rx="10"/>
<g class="ic ic-warn" transform="translate(38 37)"><circle r="10"/><path class="gl" d="M0-5V1"/><circle class="gd" cx="0" cy="4.6" r="1.4"/></g>
<text x="58" y="33" class="b">Illustrative example</text>
<text x="58" y="54" class="sm">not a real timeline</text>
<rect class="k-ok" x="16" y="82" width="30" height="14" rx="5"/>
<text x="54" y="94" class="sm">Planned: 3 hours</text>
<rect class="k-bad" x="16" y="104" width="328" height="14" rx="5"/>
<text x="16" y="140" class="sm">Actual: about 3 days</text>
<text x="16" y="186" class="hd">Day 1</text>
<text x="16" y="220" class="sm">Engineering</text>
