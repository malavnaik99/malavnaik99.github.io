<svg class="dg dg-narrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" role="img" aria-labelledby="rollback-decision-tree-n-t rollback-decision-tree-n-d">
<title id="rollback-decision-tree-n-t">Rollback decision tree</title>
<desc id="rollback-decision-tree-n-d">Start: the deployment fails. Question 1: did the schema change? If no, roll back the code (low risk). If yes, question 2: is the new schema backward compatible? If yes, roll back the code (low risk). If no, question 3: can we fix forward safely? If yes, fix forward (medium risk). If no, restore from backup and reconcile (high risk).</desc>
<defs><marker id="rollback-decision-tree-n-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 10 5 0 10z"/></marker></defs>
<rect class="k-bad" x="26" y="12" width="172" height="48" rx="12"/>
<text x="112" y="41" class="b" text-anchor="middle">Deployment fails</text>
<g class="ic ic-bad" transform="translate(194 16)"><circle r="10"/><path class="gl" d="M-3.5-3.5 3.5 3.5M3.5-3.5-3.5 3.5"/></g>
<line class="ln" x1="112" y1="60" x2="112" y2="81" marker-end="url(#rollback-decision-tree-n-ah)"/>
<path class="k-n" d="M112 82 L208 142.0 L112 202 L16 142.0Z"/>
<text x="112" y="128" class="b" text-anchor="middle">Did the</text>
<text x="112" y="147" class="b" text-anchor="middle">schema</text>
<text x="112" y="166" class="b" text-anchor="middle">change?</text>
<line class="ln" x1="208" y1="142" x2="251" y2="142" marker-end="url(#rollback-decision-tree-n-ah)"/>
<text x="230" y="134" class="sm" text-anchor="middle">No</text>
<rect class="k-ok" x="252" y="102" width="100" height="80" rx="12"/>
<text x="302" y="128" class="b" text-anchor="middle">Roll back</text>
<text x="302" y="147" class="b" text-anchor="middle">code</text>
<text x="302" y="166" class="sm" text-anchor="middle">Low risk</text>
<g class="ic ic-ok" transform="translate(348 106)"><circle r="10"/><path class="gl" d="M-4.5 .5 -1.5 3.5 4.5-3"/></g>
<text x="124" y="219" class="sm">Yes</text>
<line class="ln" x1="112" y1="202" x2="112" y2="223" marker-end="url(#rollback-decision-tree-n-ah)"/>
<path class="k-n" d="M112 224 L208 284.0 L112 344 L16 284.0Z"/>
<text x="112" y="279.5" class="b" text-anchor="middle">Backward</text>
<text x="112" y="298.5" class="b" text-anchor="middle">compatible?</text>
<line class="ln" x1="208" y1="284" x2="251" y2="284" marker-end="url(#rollback-decision-tree-n-ah)"/>
<text x="230" y="276" class="sm" text-anchor="middle">Yes</text>
<rect class="k-ok" x="252" y="244" width="100" height="80" rx="12"/>
<text x="302" y="270" class="b" text-anchor="middle">Roll back</text>
<text x="302" y="289" class="b" text-anchor="middle">code</text>
<text x="302" y="308" class="sm" text-anchor="middle">Low risk</text>
<g class="ic ic-ok" transform="translate(348 248)"><circle r="10"/><path class="gl" d="M-4.5 .5 -1.5 3.5 4.5-3"/></g>
<text x="124" y="361" class="sm">No</text>
<line class="ln" x1="112" y1="344" x2="112" y2="365" marker-end="url(#rollback-decision-tree-n-ah)"/>
<path class="k-n" d="M112 366 L208 426.0 L112 486 L16 426.0Z"/>
<text x="112" y="412" class="b" text-anchor="middle">Can we</text>
<text x="112" y="431" class="b" text-anchor="middle">fix forward</text>
<text x="112" y="450" class="b" text-anchor="middle">safely?</text>
<line class="ln" x1="208" y1="426" x2="251" y2="426" marker-end="url(#rollback-decision-tree-n-ah)"/>
<text x="230" y="418" class="sm" text-anchor="middle">Yes</text>
<rect class="k-warn" x="252" y="386" width="100" height="80" rx="12"/>
<text x="302" y="412" class="b" text-anchor="middle">Fix</text>
<text x="302" y="431" class="b" text-anchor="middle">forward</text>
<text x="302" y="450" class="sm" text-anchor="middle">Medium risk</text>
<g class="ic ic-warn" transform="translate(348 390)"><circle r="10"/><path class="gl" d="M0-5V1"/><circle class="gd" cx="0" cy="4.6" r="1.4"/></g>
<text x="124" y="503" class="sm">No</text>
<line class="ln" x1="112" y1="486" x2="112" y2="507" marker-end="url(#rollback-decision-tree-n-ah)"/>
<rect class="k-bad" x="20" y="508" width="184" height="64" rx="12"/>
<text x="112" y="535.5" class="b" text-anchor="middle">Restore backup</text>
<text x="112" y="554.5" class="b" text-anchor="middle">+ reconcile</text>
<g class="ic ic-bad" transform="translate(200 512)"><circle r="10"/><path class="gl" d="M-3.5-3.5 3.5 3.5M3.5-3.5-3.5 3.5"/></g>
<text x="112" y="592" class="sm" text-anchor="middle">High risk: data loss</text>
</svg>
