<svg class="dg dg-wide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="restore-options-w-t restore-options-w-d">
<title id="restore-options-w-t">Full restore versus surgical repair</title>
<desc id="restore-options-w-d">Before: the database holds good data, rows damaged by the migration, and new data written since. A full restore over production keeps only the good data from before the migration: the damaged rows and all new data are lost, so real work must be redone. A surgical repair restores a copy alongside production and copies back only the damaged rows: good data stays, damaged rows are repaired, and new data is kept. It is slower and needs care.</desc>
<defs><marker id="restore-options-w-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 10 5 0 10z"/></marker></defs>
<rect class="k-n" x="16" y="12" width="456" height="336" rx="14" fill-opacity="0"/>
<text x="244" y="44" class="hd" text-anchor="middle">Full restore</text>
<text x="244" y="66" class="sm" text-anchor="middle">restore over production</text>
<text x="36" y="98" class="sm">Before</text>
<rect class="k-n" x="36" y="108" width="195.68" height="40" rx="8"/>
<text x="133.84" y="133" class="sm" text-anchor="middle">Good data</text>
<rect class="k-bad" x="235.68" y="108" width="95.84" height="40" rx="8"/>
<text x="283.6" y="133" class="sm" text-anchor="middle">Damaged</text>
<rect class="k-user" x="335.52" y="108" width="112.48" height="40" rx="8"/>
<text x="391.76" y="133" class="sm" text-anchor="middle">New data</text>
<line class="ln" x1="244" y1="154" x2="244" y2="182" marker-end="url(#restore-options-w-ah)"/>
<text x="36" y="198" class="sm">After</text>
<rect class="k-n" x="36" y="208" width="195.68" height="40" rx="8"/>
<text x="133.84" y="233" class="sm" text-anchor="middle">Good data</text>
<rect class="k-lost" x="235.68" y="208" width="95.84" height="40" rx="8"/>
<text x="283.6" y="233" class="sm" text-anchor="middle">Lost</text>
<rect class="k-lost" x="335.52" y="208" width="112.48" height="40" rx="8"/>
<text x="391.76" y="233" class="sm" text-anchor="middle">Lost</text>
<rect class="k-bad" x="36" y="272" width="416" height="58" rx="12"/>
<text x="244" y="296.5" class="b" text-anchor="middle">Real work lost</text>
<text x="244" y="315.5" class="sm" text-anchor="middle">users must redo it</text>
<g class="ic ic-bad" transform="translate(448 276)"><circle r="10"/><path class="gl" d="M-3.5-3.5 3.5 3.5M3.5-3.5-3.5 3.5"/></g>
<rect class="k-n" x="488" y="12" width="456" height="336" rx="14" fill-opacity="0"/>
<text x="716" y="44" class="hd" text-anchor="middle">Surgical repair</text>
<text x="716" y="66" class="sm" text-anchor="middle">restore alongside, copy back</text>
<text x="508" y="98" class="sm">Before</text>
<rect class="k-n" x="508" y="108" width="195.68" height="40" rx="8"/>
<text x="605.84" y="133" class="sm" text-anchor="middle">Good data</text>
<rect class="k-bad" x="707.68" y="108" width="95.84" height="40" rx="8"/>
<text x="755.6" y="133" class="sm" text-anchor="middle">Damaged</text>
<rect class="k-user" x="807.52" y="108" width="112.48" height="40" rx="8"/>
<text x="863.76" y="133" class="sm" text-anchor="middle">New data</text>
<line class="ln" x1="716" y1="154" x2="716" y2="182" marker-end="url(#restore-options-w-ah)"/>
<text x="508" y="198" class="sm">After</text>
<rect class="k-n" x="508" y="208" width="195.68" height="40" rx="8"/>
<text x="605.84" y="233" class="sm" text-anchor="middle">Good data</text>
<rect class="k-ok" x="707.68" y="208" width="95.84" height="40" rx="8"/>
<text x="755.6" y="233" class="sm" text-anchor="middle">Repaired</text>
<rect class="k-user" x="807.52" y="208" width="112.48" height="40" rx="8"/>
<text x="863.76" y="233" class="sm" text-anchor="middle">Kept</text>
<rect class="k-ok" x="508" y="272" width="416" height="58" rx="12"/>
<text x="716" y="296.5" class="b" text-anchor="middle">Every good write kept</text>
<text x="716" y="315.5" class="sm" text-anchor="middle">slower, needs care</text>
<g class="ic ic-ok" transform="translate(920 276)"><circle r="10"/><path class="gl" d="M-4.5 .5 -1.5 3.5 4.5-3"/></g>
</svg>
