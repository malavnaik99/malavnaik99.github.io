<svg class="dg dg-wide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 222" role="img" aria-labelledby="maintenance-window-w-t maintenance-window-w-d">
<title id="maintenance-window-w-t">A normal three-hour maintenance window</title>
<desc id="maintenance-window-w-d">Eight steps in order: announce (days before), freeze changes (day before), then inside the window: holding page on (about 5 minutes), backup and snapshot (about 20), deploy the new version (about 15), run database migrations (about 45), smoke tests of login, MFA, submit and pay (about 30), and reopen (about 5). That is about two hours of work plus an hour of buffer, so roughly three hours in total.</desc>
<defs><marker id="maintenance-window-w-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 10 5 0 10z"/></marker></defs>
<rect class="k-user" x="16" y="44" width="104" height="74" rx="12"/>
<text x="68" y="86" class="b" text-anchor="middle">Announce</text>
<text x="68" y="30" class="sm" text-anchor="middle">1</text>
<text x="68" y="142" class="sm" text-anchor="middle">days before</text>
<rect class="k-n" x="134" y="44" width="104" height="74" rx="12"/>
<text x="186" y="76.5" class="b" text-anchor="middle">Freeze</text>
<text x="186" y="95.5" class="b" text-anchor="middle">changes</text>
<text x="186" y="30" class="sm" text-anchor="middle">2</text>
<text x="186" y="142" class="sm" text-anchor="middle">day before</text>
<line class="ln" x1="121" y1="81" x2="133" y2="81" marker-end="url(#maintenance-window-w-ah)"/>
<rect class="k-user" x="252" y="44" width="104" height="74" rx="12"/>
<text x="304" y="76.5" class="b" text-anchor="middle">Holding</text>
<text x="304" y="95.5" class="b" text-anchor="middle">page on</text>
<text x="304" y="30" class="sm" text-anchor="middle">3</text>
<text x="304" y="142" class="sm" text-anchor="middle">~5 min</text>
<line class="ln" x1="239" y1="81" x2="251" y2="81" marker-end="url(#maintenance-window-w-ah)"/>
<rect class="k-n" x="370" y="44" width="104" height="74" rx="12"/>
<text x="422" y="76.5" class="b" text-anchor="middle">Backup &amp;</text>
<text x="422" y="95.5" class="b" text-anchor="middle">snapshot</text>
<text x="422" y="30" class="sm" text-anchor="middle">4</text>
<text x="422" y="142" class="sm" text-anchor="middle">~20 min</text>
<line class="ln" x1="357" y1="81" x2="369" y2="81" marker-end="url(#maintenance-window-w-ah)"/>
<rect class="k-n" x="488" y="44" width="104" height="74" rx="12"/>
<text x="540" y="76.5" class="b" text-anchor="middle">Deploy new</text>
<text x="540" y="95.5" class="b" text-anchor="middle">version</text>
<text x="540" y="30" class="sm" text-anchor="middle">5</text>
<text x="540" y="142" class="sm" text-anchor="middle">~15 min</text>
<line class="ln" x1="475" y1="81" x2="487" y2="81" marker-end="url(#maintenance-window-w-ah)"/>
<rect class="k-n" x="606" y="44" width="104" height="74" rx="12"/>
<text x="658" y="76.5" class="b" text-anchor="middle">Run</text>
<text x="658" y="95.5" class="b" text-anchor="middle">migrations</text>
<text x="658" y="30" class="sm" text-anchor="middle">6</text>
<text x="658" y="142" class="sm" text-anchor="middle">~45 min</text>
<line class="ln" x1="593" y1="81" x2="605" y2="81" marker-end="url(#maintenance-window-w-ah)"/>
<rect class="k-n" x="724" y="44" width="104" height="74" rx="12"/>
<text x="776" y="76.5" class="b" text-anchor="middle">Smoke</text>
<text x="776" y="95.5" class="b" text-anchor="middle">tests</text>
<text x="776" y="30" class="sm" text-anchor="middle">7</text>
<text x="776" y="142" class="sm" text-anchor="middle">~30 min</text>
<line class="ln" x1="711" y1="81" x2="723" y2="81" marker-end="url(#maintenance-window-w-ah)"/>
<rect class="k-ok" x="842" y="44" width="104" height="74" rx="12"/>
<text x="894" y="86" class="b" text-anchor="middle">Reopen</text>
<g class="ic ic-ok" transform="translate(942 48)"><circle r="10"/><path class="gl" d="M-4.5 .5 -1.5 3.5 4.5-3"/></g>
<text x="894" y="30" class="sm" text-anchor="middle">8</text>
<text x="894" y="142" class="sm" text-anchor="middle">~5 min</text>
<line class="ln" x1="829" y1="81" x2="841" y2="81" marker-end="url(#maintenance-window-w-ah)"/>
<path class="br" d="M16 164 v8 h104 v-8"/>
<text x="68" y="194" class="sm" text-anchor="middle">Before</text>
<path class="br-ok" d="M252 164 v8 H946 v-8"/>
<text x="599" y="194" class="b" text-anchor="middle">The announced window: ≈ 3 hours (≈ 2 hours of work + 1 hour buffer)</text>
</svg>
