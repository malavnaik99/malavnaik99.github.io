<svg class="dg dg-narrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="maintenance-window-n-t maintenance-window-n-d">
<title id="maintenance-window-n-t">A normal three-hour maintenance window</title>
<desc id="maintenance-window-n-d">Eight steps in order: announce (days before), freeze changes (day before), then inside the window: holding page on (about 5 minutes), backup and snapshot (about 20), deploy the new version (about 15), run database migrations (about 45), smoke tests of login, MFA, submit and pay (about 30), and reopen (about 5). That is about two hours of work plus an hour of buffer, so roughly three hours in total.</desc>
<defs><marker id="maintenance-window-n-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 10 5 0 10z"/></marker></defs>
<circle class="k-user num" cx="22" cy="35" r="13"/>
<text x="22" y="40" class="sm" text-anchor="middle">1</text>
<rect class="k-user" x="48" y="12" width="196" height="46" rx="12"/>
<text x="146" y="40" class="b" text-anchor="middle">Announce</text>
<text x="256" y="40" class="sm">days before</text>
<circle class="k-n num" cx="22" cy="95" r="13"/>
<text x="22" y="100" class="sm" text-anchor="middle">2</text>
<rect class="k-n" x="48" y="72" width="196" height="46" rx="12"/>
<text x="146" y="100" class="b" text-anchor="middle">Freeze changes</text>
<text x="256" y="100" class="sm">day before</text>
<line class="ln" x1="146" y1="59" x2="146" y2="71" marker-end="url(#maintenance-window-n-ah)"/>
<circle class="k-user num" cx="22" cy="155" r="13"/>
<text x="22" y="160" class="sm" text-anchor="middle">3</text>
<rect class="k-user" x="48" y="132" width="196" height="46" rx="12"/>
<text x="146" y="160" class="b" text-anchor="middle">Holding page on</text>
<text x="256" y="160" class="sm">~5 min</text>
<line class="ln" x1="146" y1="119" x2="146" y2="131" marker-end="url(#maintenance-window-n-ah)"/>
<circle class="k-n num" cx="22" cy="215" r="13"/>
<text x="22" y="220" class="sm" text-anchor="middle">4</text>
<rect class="k-n" x="48" y="192" width="196" height="46" rx="12"/>
<text x="146" y="220" class="b" text-anchor="middle">Backup &amp; snapshot</text>
<text x="256" y="220" class="sm">~20 min</text>
<line class="ln" x1="146" y1="179" x2="146" y2="191" marker-end="url(#maintenance-window-n-ah)"/>
<circle class="k-n num" cx="22" cy="275" r="13"/>
<text x="22" y="280" class="sm" text-anchor="middle">5</text>
<rect class="k-n" x="48" y="252" width="196" height="46" rx="12"/>
<text x="146" y="280" class="b" text-anchor="middle">Deploy new version</text>
<text x="256" y="280" class="sm">~15 min</text>
<line class="ln" x1="146" y1="239" x2="146" y2="251" marker-end="url(#maintenance-window-n-ah)"/>
<circle class="k-n num" cx="22" cy="335" r="13"/>
<text x="22" y="340" class="sm" text-anchor="middle">6</text>
<rect class="k-n" x="48" y="312" width="196" height="46" rx="12"/>
<text x="146" y="340" class="b" text-anchor="middle">Run migrations</text>
<text x="256" y="340" class="sm">~45 min</text>
<line class="ln" x1="146" y1="299" x2="146" y2="311" marker-end="url(#maintenance-window-n-ah)"/>
<circle class="k-n num" cx="22" cy="395" r="13"/>
<text x="22" y="400" class="sm" text-anchor="middle">7</text>
<rect class="k-n" x="48" y="372" width="196" height="46" rx="12"/>
<text x="146" y="400" class="b" text-anchor="middle">Smoke tests</text>
<text x="256" y="400" class="sm">~30 min</text>
<line class="ln" x1="146" y1="359" x2="146" y2="371" marker-end="url(#maintenance-window-n-ah)"/>
<circle class="k-ok num" cx="22" cy="455" r="13"/>
<text x="22" y="460" class="sm" text-anchor="middle">8</text>
<rect class="k-ok" x="48" y="432" width="196" height="46" rx="12"/>
<text x="146" y="460" class="b" text-anchor="middle">Reopen</text>
<g class="ic ic-ok" transform="translate(240 436)"><circle r="10"/><path class="gl" d="M-4.5 .5 -1.5 3.5 4.5-3"/></g>
<text x="256" y="460" class="sm">~5 min</text>
<line class="ln" x1="146" y1="419" x2="146" y2="431" marker-end="url(#maintenance-window-n-ah)"/>
<path class="br-ok" d="M352 140 h-6 V484 h6"/>
<text x="180" y="520" class="b" text-anchor="middle">Window ≈ 3 hours</text>
<text x="180" y="542" class="sm" text-anchor="middle">≈ 2 hours of work + 1 hour buffer</text>
</svg>
