{% assign person_id = "/#person" | absolute_url %}{% assign page_url = page.canonical_url | default: page.url | absolute_url %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {%- assign id = site.data.identity %}
    {
      "@type": "Person",
      "@id": {{ person_id | jsonify }},
      "name": {{ id.name | jsonify }},
      "alternateName": "Malav Hiteshbhai Naik",
      "url": {{ id.site | append: "/" | jsonify }},
      "email": {{ id.email | prepend: "mailto:" | jsonify }},
      "image": {{ "/images/malav-naik-portrait.jpg" | absolute_url | jsonify }},
      "description": {{ id.bio_medium | jsonify }},
      "jobTitle": [{{ id.job_title | jsonify }}, {{ id.current_role.title | jsonify }}],
      "worksFor": { "@type": "Organization", "name": {{ id.current_role.organization | jsonify }} },
      "alumniOf": [{% for e in id.education %}
        { "@type": "CollegeOrUniversity", "name": {{ e.institution | jsonify }} }{% unless forloop.last %},{% endunless %}{% endfor %}
      ],
      "address": { "@type": "PostalAddress", "addressLocality": {{ id.location.city | jsonify }}, "addressCountry": {{ id.location.country_code | jsonify }} },
      "knowsAbout": {{ id.skills | jsonify }},
      "sameAs": {{ id.profiles | where_exp: "p", "p.name != 'MSc thesis'" | map: "url" | jsonify }}
    }{% if page.url == "/" %},
    {
      "@type": "WebSite",
      "@id": {{ "/#website" | absolute_url | jsonify }},
      "name": {{ site.title | jsonify }},
      "alternateName": "Malav Naik",
      "url": {{ "/" | absolute_url | jsonify }},
      "description": {{ site.description | jsonify }},
      "inLanguage": "en",
      "author": { "@id": {{ person_id | jsonify }} }
    }{% endif %}{% if page.url == "/about/" %},
    {
      "@type": "ProfilePage",
      "url": {{ page_url | jsonify }},
      "mainEntity": { "@id": {{ person_id | jsonify }} }
    }{% endif %}{% if page.collection == "posts" %},
    {
      "@type": "BlogPosting",
      "headline": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "image": {{ page.image.path | default: page.image | absolute_url | jsonify }},
      "author": { "@id": {{ person_id | jsonify }}, "name": "Malav Naik", "url": {{ "/about/" | absolute_url | jsonify }} },
      "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
      "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},
      "mainEntityOfPage": { "@type": "WebPage", "@id": {{ page_url | jsonify }} },
      "keywords": {{ page.tags | join: ", " | jsonify }},
      "inLanguage": "en"
    }{% endif %}{% if page.collection == "projects" %},
    {
      "@type": {% if page.code_url %}"SoftwareSourceCode"{% else %}"CreativeWork"{% endif %},
      "name": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "url": {{ page_url | jsonify }},{% if page.code_url %}
      "codeRepository": {{ page.code_url | jsonify }},{% endif %}{% if page.tech %}
      "keywords": {{ page.tech | join: ", " | jsonify }},{% endif %}
      "author": { "@id": {{ person_id | jsonify }}, "name": "Malav Naik" }
    }{% endif %}{% if page.web_app %},
    {
      "@type": "WebApplication",
      "name": {{ page.web_app.name | jsonify }},
      "description": {{ page.description | jsonify }},
      "url": {{ page_url | jsonify }},
      "applicationCategory": {{ page.web_app.category | jsonify }},
      "operatingSystem": "Any",
      "isAccessibleForFree": true,
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
      "creator": { "@id": {{ person_id | jsonify }}, "name": "Malav Naik" },
      "isBasedOn": {{ page.web_app.sources | jsonify }}
    }{% endif %}{% if page.dataset %},
    {
      "@type": "Dataset",
      "name": {{ page.dataset.name | jsonify }},
      "description": {{ page.dataset.description | jsonify }},
      "url": {{ page.dataset.url | jsonify }},
{% if page.dataset.license %}      "license": {{ page.dataset.license | jsonify }},
{% endif %}{%- comment -%} When the data itself last changed: the CSO's own update date for rent pages, else the page's last commit. {%- endcomment %}
{% assign ds_mod = site.data.lastmod[page.path] | default: site.time | date: "%Y-%m-%d" %}{% if page.url contains "/rent/" %}{% assign ds_mod = site.data.rent_summary.data_updated_iso %}{% endif %}      "dateModified": {{ ds_mod | jsonify }},
      "sameAs": {{ page_url | jsonify }},
      "keywords": {{ page.dataset.keywords | join: ", " | jsonify }},
      "spatialCoverage": {{ page.dataset.place | jsonify }},
      "isAccessibleForFree": true,
      "creator": {% if page.dataset.creator %}{ "@type": "Organization", "name": {{ page.dataset.creator | jsonify }} }{% else %}{ "@id": {{ person_id | jsonify }}, "name": "Malav Naik" }{% endif %},
      "isBasedOn": {{ page.dataset.sources | jsonify }}
    }{% endif %}{% if page.faq %},
    {
      "@type": "FAQPage",
      "url": {{ page_url | jsonify }},
      "mainEntity": [{% for f in page.faq %}
        { "@type": "Question", "name": {{ f.q | jsonify }}, "acceptedAnswer": { "@type": "Answer", "text": {{ f.a | markdownify | strip_html | strip | jsonify }} } }{% unless forloop.last %},{% endunless %}{% endfor %}
      ]
    }{% endif %}{% unless page.url == "/" or page.url == "/404.html" %},
    {%- comment -%} Breadcrumbs: Home > parent section(s) > this page. Posts sit under Writing, projects under Work;
    other pages under each parent folder that is itself a page (e.g. /rent/galway/ is under /rent/).
    A page's crumb name is its `breadcrumb`, else `rent_county`, else its title. {%- endcomment %}
    {%- assign parents = "" | split: "" %}
    {%- if page.collection == "posts" %}{% assign parents = site.html_pages | where: "url", "/writing/" %}
    {%- elsif page.collection == "projects" %}{% assign parents = site.html_pages | where: "url", "/work/" %}
    {%- else %}{% assign segs = page.url | split: "/" %}{% assign prefix = "/" %}
      {%- for seg in segs %}{% if seg == "" or forloop.last %}{% continue %}{% endif %}{% assign prefix = prefix | append: seg | append: "/" %}
        {%- assign hit = site.html_pages | where: "url", prefix %}{% assign parents = parents | concat: hit %}{% endfor %}
    {%- endif %}
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": {{ "/" | absolute_url | jsonify }} },{% for b in parents %}
        { "@type": "ListItem", "position": {{ forloop.index | plus: 1 }}, "name": {{ b.breadcrumb | default: b.title | jsonify }}, "item": {{ b.url | absolute_url | jsonify }} },{% endfor %}
        { "@type": "ListItem", "position": {{ parents.size | plus: 2 }}, "name": {{ page.breadcrumb | default: page.rent_county | default: page.title | jsonify }}, "item": {{ page_url | jsonify }} }
      ]
    }{% endunless %}
  ]
}
</script>
