{% assign person_id = "/#person" | absolute_url %}{% assign page_url = page.canonical_url | default: page.url | absolute_url %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {%- assign id = site.data.identity %}
    {
      "@type": "Person",
      "@id": {{ person_id | jsonify }},
      "name": {{ id.name | jsonify }},
      "alternateName": "Malav Hiteshbhai Naik",
      "url": {{ id.site | append: "/" | jsonify }},
      "email": {{ id.email | prepend: "mailto:" | jsonify }},
      "image": {{ "/images/malav-naik-portrait.jpg" | absolute_url | jsonify }},
      "description": {{ id.bio_medium | jsonify }},
      "jobTitle": [{{ id.job_title | jsonify }}, {{ id.current_role.title | jsonify }}],
      "worksFor": { "@type": "Organization", "name": {{ id.current_role.organization | jsonify }} },
      "alumniOf": [{% for e in id.education %}
        { "@type": "CollegeOrUniversity", "name": {{ e.institution | jsonify }} }{% unless forloop.last %},{% endunless %}{% endfor %}
      ],
      "address": { "@type": "PostalAddress", "addressLocality": {{ id.location.city | jsonify }}, "addressCountry": {{ id.location.country_code | jsonify }} },
      "knowsAbout": {{ id.skills | jsonify }},
      "sameAs": {{ id.profiles | where_exp: "p", "p.name != 'MSc thesis'" | map: "url" | jsonify }}
    }{% if page.url == "/" %},
    {
      "@type": "WebSite",
      "@id": {{ "/#website" | absolute_url | jsonify }},
      "name": {{ site.title | jsonify }},
      "alternateName": "Malav Naik",
      "url": {{ "/" | absolute_url | jsonify }},
      "description": {{ site.description | jsonify }},
      "inLanguage": "en",
      "author": { "@id": {{ person_id | jsonify }} }
    }{% endif %}{% if page.url == "/about/" %},
    {
      "@type": "ProfilePage",
      "url": {{ page_url | jsonify }},
      "mainEntity": { "@id": {{ person_id | jsonify }} }
    }{% endif %}{% if page.collection == "posts" %},
    {
      "@type": "BlogPosting",
      "headline": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "image": {{ page.image.path | default: page.image | absolute_url | jsonify }},
      "author": { "@id": {{ person_id | jsonify }}, "name": "Malav Naik", "url": {{ "/about/" | absolute_url | jsonify }} },
      "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
      "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},
      "mainEntityOfPage": { "@type": "WebPage", "@id": {{ page_url | jsonify }} },
      "keywords": {{ page.tags | join: ", " | jsonify }},
      "inLanguage": "en"
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": {{ "/" | absolute_url | jsonify }} },
        { "@type": "ListItem", "position": 2, "name": "Writing", "item": {{ "/writing/" | absolute_url | jsonify }} },
        { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": {{ page_url | jsonify }} }
      ]
    }{% endif %}{% if page.collection == "projects" %},
    {
      "@type": {% if page.code_url %}"SoftwareSourceCode"{% else %}"CreativeWork"{% endif %},
      "name": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "url": {{ page_url | jsonify }},{% if page.code_url %}
      "codeRepository": {{ page.code_url | jsonify }},{% endif %}{% if page.tech %}
      "keywords": {{ page.tech | join: ", " | jsonify }},{% endif %}
      "author": { "@id": {{ person_id | jsonify }}, "name": "Malav Naik" }
    }{% endif %}{% if page.dataset %},
    {
      "@type": "Dataset",
      "name": {{ page.dataset.name | jsonify }},
      "description": {{ page.dataset.description | jsonify }},
      "url": {{ page.dataset.url | jsonify }},
{% if page.dataset.license %}      "license": {{ page.dataset.license | jsonify }},
{% endif %}      "sameAs": {{ page_url | jsonify }},
      "keywords": {{ page.dataset.keywords | join: ", " | jsonify }},
      "spatialCoverage": {{ page.dataset.place | jsonify }},
      "isAccessibleForFree": true,
      "creator": { "@id": {{ person_id | jsonify }}, "name": "Malav Naik" },
      "isBasedOn": {{ page.dataset.sources | jsonify }}
    }{% endif %}
  ]
}
</script>
