# ONE-OFF cleanup (25 Nov 2026): deletes 35 old branches whose work is already on the live site
# (or that only hold old redesign screenshots). Runs only when you press "Run workflow".
# Safety: a branch is deleted only if it still points at the exact commit checked on 25 Nov 2026;
# if anything was added to it since, it's skipped and listed. main and cookie-consent-banner are never touched.
# After it has run, this file should be removed again (Claude does that in a follow-up PR).
name: Delete old branches

on:
  workflow_dispatch:

permissions:
  contents: write   # delete branches
  issues: write     # report a failure

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete each branch if it's unchanged since it was checked
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCHES: |
            bikes-report-2026-10 9bde5eca10806d3d077d78aaa2cdef713df1cde3
            claude/awesome-maxwell-of6p6g 80fcd1f9dfbcda1aaa59994bc5d21203948590c5
            claude/charming-cannon-50nng5 dbaf2307df7ca7db5fed32e514df30db68a9561d
            claude/eager-maxwell-ohsopw fbb4fea8917f51a396cb79d82d5569e440aa0b92
            claude/hopeful-sagan-ux5bpw 3fad77c004d5b754c7e1530594682249edf82f4d
            claude/inspiring-euler-mnn6px 6e6d8a93940ad6b60f5f4ae0f16c8e3784cfdc47
            claude/nifty-lamport-9v4vzh 1d0fcfd307d02fd32118f4fa5b6efa6da7bfef92
            claude/og-banner-genai fe856138a2021f71fb690233c0af8f4fb2dc1acb
            claude/optimistic-noether-e9jv48 f98d0ab8ebab987d27cc579692730b5f6103da6c
            claude/pensive-curie-ueo7g4 16a857d53af8239a1fc9837dc7d557c5288a3980
            claude/vigilant-ramanujan-xvhrqq 545c2246d2d65e63563589e76ba65f905d9d2514
            deploy-retry 94c6209dc444dc496ed86e621c1c59610934b8db
            fix-bikes-report-workflow b6032afb312e206d278074845e9c1f1ca78be83c
            fix-launch-badge 8159420a8b22c6994e3966c401bff996f51e3f9e
            ga4-direct-tag f4fb0154696daccd0950050fb30d0aa957d3300a
            maintenance-deploy-hiccup 209198824a1366ceaa7ad47e7c04c25b9aa2afa6
            maintenance-seo-notes 50e75ceb6fd95527838993c32c19947cacaab752
            met-eireann-source 8b7964281106076fefd7235c079f3ebac2a369bf
            pipeline-test-count dc00f713ac2a6b3049609ba44258322a17c9ece4
            redesign e40eff4208072e3472f5605ad184882734eb5cf2
            redesign-c 41052a27c1a06ee297c26268d3cf87688de21677
            redesign-c-preview ade96825236b611f069dbc9aacb5f04f95580e3d
            redesign-preview fdccd3d9f0aaf2f4f2e0708f1e63604765e469e6
            redesign-signal a2ed8af64acc3bcf95981656265b4f35f3034ef5
            redesign-signal-preview 2590e4e1f296017a7c1cd58e053a3f74b5d12179
            remaining-stamps-reviewed abcc1aad46b7a5e7dea5023b8c89a16e29a8fa1c
            search-hide-unreviewed bbe7c4be185a9b250ea44ed466d6c50c2eb53b0e
            seo-trust-improvements 3d4e81e34ee875bf150bc57a8217bd47896412c6
            seo-upgrade b7edfdd0745d5d69e9c63ab1fe56980126414fbf
            sitemap-post-dates d25f12b20ba0aa8891b8060b0ac5a1fd9e1b818c
            stamp-1-reviewed 973580d8d458892ecdfbb0daf4ded6b69112263f
            stamp-1g-reviewed 0338cd874ff07a14307987506f1789b2611c4c15
            stamp-2-reviewed c74a754e52a74c6ca44ea0faca698590ae0b2d18
            stamp-4-reviewed 0fa56ff7d3d8436fe252f9b58bbbe302b24b4784
            stamp-faq-sources 159bad84f3d140d6b6349fd27813c7dee089b747
        run: |
          deleted=0; gone=0; skipped=""; failed=""
          while read -r b sha; do
            [ -z "$b" ] && continue
            case "$b" in main|cookie-consent-banner) continue;; esac
            now=$(gh api "repos/$REPO/git/ref/heads/$b" --jq .object.sha 2>/dev/null) || { gone=$((gone+1)); continue; }
            if [ "$now" != "$sha" ]; then skipped="$skipped $b"; continue; fi
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$b" >/dev/null; then deleted=$((deleted+1)); else failed="$failed $b"; fi
          done <<< "$BRANCHES"
          { echo "Deleted: $deleted. Already gone: $gone."
            [ -n "$skipped" ] && echo "Skipped (changed since 25 Nov, kept):$skipped"
            [ -n "$failed" ] && echo "Could not delete:$failed"; } | tee -a "$GITHUB_STEP_SUMMARY"
          [ -z "$failed" ]
      - name: Report the failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Delete old branches: some branches could not be deleted" --body "**What happened:** the one-off branch cleanup couldn't delete some branches. **The live site is not affected**: branches are only copies of past work.

          **What to do:** open the run below and read the summary for the branch names, then delete them by hand at https://github.com/$GITHUB_REPOSITORY/branches/all (trash icon), or paste this issue to Claude.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
