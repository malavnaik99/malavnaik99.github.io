# Temporary, one-off: downloads the River Liffey from OpenStreetMap on GitHub's servers (this repo's cloud sessions
# can't reach overpass-api.de) and prints the checked result into the log. Read-only; removed right after.
name: River download (one-off)
on:
  push:
    branches: [claude/vigilant-ramanujan-xvhrqq]
    paths: [.github/workflows/river-once.yml]
permissions:
  contents: read
jobs:
  river:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Download and check the river (refuses to save a river that doesn't pass the quays)
        run: python3 scripts/make_sky.py --river
      - name: Print the saved file for copying
        run: echo "RIVER_JSON_START"; cat _data/sky_river.json; echo; echo "RIVER_JSON_END"
