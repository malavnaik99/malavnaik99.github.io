# Temporary, one-off: downloads the River Liffey from OpenStreetMap on GitHub's servers (the cloud session
# can't reach overpass-api.de) and commits _data/sky_river.json to this branch. Deleted before merging.
name: River download (one-off)
on:
  push:
    branches: [claude/pensive-curie-ueo7g4]
    paths: [.github/workflows/river-once.yml]
permissions:
  contents: write
jobs:
  river:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/make_sky.py --river
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add _data/sky_river.json
          git commit -m "Add the River Liffey line from OpenStreetMap (© OpenStreetMap contributors, ODbL)"
          git push
