# Temporary: screenshots and Lighthouse for the redesign-signal branch. Removed before merging.
name: Signal preview
on:
  push:
    branches: [redesign-signal]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out
      - name: Point links at the local copy (preview only)
        run: |
          sed -i 's#^url: .*#url: http://localhost:8080#' _config.yml
      - uses: actions/jekyll-build-pages@v1
      - name: Check image alt text
        run: |
          sudo chown -R "$USER" _site
          missing=$(grep -rlP '<img(?![^>]*\balt=)[^>]*>' _site || true); echo "Images without alt: ${missing:-none}"
      - name: Install test tools
        timeout-minutes: 6
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2 lighthouse@12.2.1 serve@14.2.4
          npx playwright install --with-deps chromium
      - name: Start a local web server (compressed, like GitHub Pages)
        timeout-minutes: 1
        run: |
          nohup ./node_modules/.bin/serve -l 8080 _site > /tmp/serve.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:8080/ >/dev/null && echo "server up" && exit 0; sleep 1; done
          cat /tmp/serve.log; exit 1
      - run: node .github/preview/shots.mjs out | tee out/js-errors.txt
      - name: Lighthouse (mobile)
        run: |
          npx lighthouse http://localhost:8080/ --quiet --output=json --output-path=/dev/null --chrome-flags="--headless=new --no-sandbox"  # warm-up run, not counted
          for p in home:/ post:/blog/precision-recall-content-moderation/ work:/work/ writing:/writing/ about:/about/; do
            n=${p%%:*}; u=http://localhost:8080${p#*:}
            npx lighthouse "$u" --quiet --output=json --output-path=out/lighthouse-$n.json --chrome-flags="--headless=new --no-sandbox"
            node -e "const r=require('./out/lighthouse-$n.json');console.log('$n', Object.values(r.categories).map(c=>c.title+' '+Math.round(c.score*100)).join(' | '));for(const a of Object.values(r.audits))if(a.score!==null&&a.score<0.9&&a.scoreDisplayMode!=='informative'&&a.scoreDisplayMode!=='notApplicable')console.log('   below 90:',a.id,a.displayValue||'')" | tee -a out/lighthouse.txt
          done
      - name: Save results to the redesign-signal-preview branch
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b redesign-signal-preview && git add . \
            && git -c user.name=preview -c user.email=preview@users.noreply.github.com commit -qm "Preview of ${GITHUB_SHA::7}" \
            && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" redesign-signal-preview
