# Temporary, one-off, read-only: shows what OpenStreetMap returns for the River Liffey search in
# scripts/make_sky.py, to find out why it came back empty. Saves nothing. Deleted afterwards.
name: River search check (one-off)
on:
  push:
    branches: [claude/pensive-curie-ueo7g4]
    paths: [.github/workflows/river-check-once.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Same search as make_sky.py, then every river or canal in the area with its tags
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          B = "53.325,-6.33,53.365,-6.21"
          def ask(q):
              r = urllib.request.Request("https://overpass-api.de/api/interpreter", data=urllib.parse.urlencode({"data": q}).encode(),
                                         headers={"User-Agent": "malavnaik.com site build (make_sky.py)"})
              return json.load(urllib.request.urlopen(r, timeout=90))
          d = ask(f'[out:json][timeout:60];way["waterway"="river"]["name"="River Liffey"]({B});out geom;')
          print("SAME SEARCH: elements =", len(d.get("elements", [])), "| remark =", d.get("remark"))
          d = ask(f'[out:json][timeout:60];way["waterway"~"river|canal"]({B});out tags;')
          print("ALL RIVERS/CANALS: elements =", len(d.get("elements", [])), "| remark =", d.get("remark"))
          for e in d.get("elements", []):
              t = e.get("tags", {})
              print(" way", e["id"], t.get("waterway"), "| name:", t.get("name"), "| name:en:", t.get("name:en"), "| name:ga:", t.get("name:ga"))
          PY
