# Temporary (run 2): inspect Google Translate's top bar on the Gujarati copy of the site. Removed right after.
name: Inspect translate bar
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-translate.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save --no-audit --no-fund playwright@1.48.2 && sleep 150 && node .github/tmp/inspect.mjs  # after the Pages deploy
