# Temporary: prints the live TL;DR and FAQ of one post once. Deleted right after.
name: Check live AEO
on:
  push:
    paths: [".github/workflows/check-live.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          P=$(curl -s https://malavnaik.com/blog/precision-recall-content-moderation/)
          echo "$P" | grep -o 'Updated <time[^>]*>[^<]*'
          echo "$P" | sed -n '/class="tldr"/,/<\/aside>/p'
          echo "$P" | sed -n '/aria-labelledby="faq"/,/<\/section>/p'
