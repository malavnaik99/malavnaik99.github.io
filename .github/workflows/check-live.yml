# Temporary: prints the live home titles, jobTitle and llms.txt summary once. Deleted right after.
name: Check live titles
on:
  push:
    paths: [".github/workflows/check-live.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://malavnaik.com/ | grep -E '<title>|og:title|twitter:title|"jobTitle"'
          curl -s https://malavnaik.com/llms.txt | sed -n 3p
