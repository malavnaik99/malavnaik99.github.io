# Temporary: checks the live redesign once. Deleted right after.
name: Check live site
on:
  push:
    paths: [".github/workflows/check-live.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://malavnaik.com
          for p in / /blog/ /projects/ /about/ /resume/ /contact/ /now/ /blog/series/genai/ /blog/precision-recall-content-moderation/ /blog/azure-sql-migration-25-percent/ /robots.txt /llms.txt /sitemap.xml /feed.xml /fef7c5983d932aef444f8519cd687495.txt /images/og-banner.png /no-such-page/; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' $B$p) $p"
          done
          echo "--- IndexNow key file:"; curl -s $B/fef7c5983d932aef444f8519cd687495.txt; echo
          echo "--- schema types on a post:"; curl -s $B/blog/precision-recall-content-moderation/ | grep -o '"@type": "[A-Za-z]*"' | sort | uniq -c
          echo "--- home og:image:"; curl -s $B/ | grep -o '<meta property="og:image" [^>]*>'
