# Builds the Jekyll site and deploys it to GitHub Pages.
name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: scripts/lastmod.py reads each page's last change for the sitemap
      - uses: actions/configure-pages@v5
      - name: Work out each page's last-change date for the sitemap
        run: python3 scripts/lastmod.py
      - name: Copy identity.json into the site and check nothing has drifted from it
        run: python3 scripts/check_identity.py
      - name: Check the Living in Ireland data (quotes word for word, wording rule)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/stamps_check.py --self-test
      - name: Check the receipt cards still match docs/METRIC_SOURCES.md
        run: python3 scripts/make_receipts.py --check
      - uses: actions/jekyll-build-pages@v1
      - name: Check every image has alt text
        run: |
          missing=$(grep -rlP '<img(?![^>]*\balt=)[^>]*>' _site || true)
          if [ -n "$missing" ]; then echo "Images without alt text in:"; echo "$missing"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
      # GitHub sometimes can't see the just-uploaded site for a few seconds ("No artifacts named github-pages"):
      # wait and try once more instead of failing. If the retry fails too, the run goes red as usual.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
