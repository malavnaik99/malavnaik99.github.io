# Temporary: prints the live favicon links once. Deleted right after.
name: Check live icons
on:
  push:
    paths: [".github/workflows/check-icons.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://malavnaik.com/ | grep -E '<link rel="(icon|apple-touch-icon|manifest)"'
          for f in favicon.ico favicon-32x32.png favicon-16x16.png apple-touch-icon.png site.webmanifest icon-192.png icon-512.png favicon.svg; do
            echo "$f $(curl -s -o /dev/null -w '%{http_code} %{content_type}' https://malavnaik.com/$f)"
          done
