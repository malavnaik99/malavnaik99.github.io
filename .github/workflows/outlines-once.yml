# Temporary, one-off: downloads the hero map's outlines (coast, Liffey, canals, Phoenix Park) from OpenStreetMap on GitHub's
# servers (this repo's cloud sessions can't reach overpass-api.de) and prints the checked result into the log. Read-only; removed right after.
name: Outlines download (one-off)
on:
  push:
    branches: [claude/nifty-lamport-9v4vzh]
    paths: [.github/workflows/outlines-once.yml]
permissions:
  contents: read
jobs:
  outlines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Download, simplify and check the outlines (refuses to save outlines that fail the checks)
        run: python3 scripts/make_sky.py --outlines
      - name: Print the saved file for copying
        run: echo "OUTLINES_JSON_START"; cat _data/sky_outlines.json; echo; echo "OUTLINES_JSON_END"
