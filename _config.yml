title: Malav Naik
tagline: Data Engineer, GenAI & AI Automation in Dublin
description: Malav Naik is a data engineer in Dublin, Ireland, working on data pipelines, GenAI and AI automation with SQL, Python, Azure and large language models, and writing about data engineering, GenAI and trust & safety.
# The site's address. The custom domain itself is set in GitHub → Settings → Pages (no CNAME file needed with Actions deploys).
url: https://malavnaik.com
author: Malav Naik
permalink: /blog/:slug/
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
exclude:
  - README.md
collections:
  projects:
    output: true
    permalink: /projects/:name/
defaults:
  # Default share image for every page; posts and pages with their own `image` keep theirs.
  - scope: { path: "" }
    values:
      image: { path: /images/og-banner.png, width: 1200, height: 627, alt: "Malav Naik – Data Engineer, GenAI & AI Automation, Dublin, Ireland" }
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: projects }
    values: { layout: project }
