# Must match identity/identity.json (scripts/check_identity.py fails the deploy if not).
# Every <title> is "<page> | title"; the home page is just the title.
title: Malav Naik | Data & GenAI Engineer | Dublin, Ireland
description: Malav Naik is a Data & GenAI Engineer in Dublin, Ireland, building data pipelines, GenAI and AI automation with SQL, Python, Azure and large language models, and writing about data engineering, GenAI and trust & safety.
# The site's address, with no baseurl. The custom domain is set in GitHub → Settings → Pages; CNAME records it in the repo too.
url: https://malavnaik.com
author:
  name: Malav Naik
  twitter: malavnaik99
permalink: /blog/:slug/
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
exclude:
  - README.md
  - CLAUDE.md
  - backlinks/
  - docs/
  - seo/          # private SEO notes and outreach drafts, never published
collections:
  projects:
    output: true
    permalink: /projects/:name/
defaults:
  # Default share image for every page; posts and pages with their own `image` keep theirs.
  - scope: { path: "" }
    values:
      image: { path: /images/og-banner.png, width: 1200, height: 627, alt: "Malav Naik | Data & GenAI Engineer | Dublin, Ireland" }
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: projects }
    values: { layout: project }
twitter:
  username: malavnaik99
  card: summary_large_image
# "Find me online" links live in identity/identity.json (profiles).
# Filled in once Malav creates the accounts (public values, not secrets).
goatcounter: "malavnaik"
webmaster_verifications:
  google: "M7EaFJlDdYQlN0kAeaaoMTtUYZS-etqEGl0xiITxPCY"
